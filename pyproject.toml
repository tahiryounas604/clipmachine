[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmachine"
version = "0.1.0"
description = "Turn long videos into ranked vertical short clips: ffmpeg scene/silence/energy detection, segment ranking, 9:16 reframe."
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
clipmachine = "clipmachine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
